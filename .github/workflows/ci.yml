name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: node scripts/check-syntax.mjs
      - name: Smoke test
        run: node tests/smoke.mjs

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for committed secrets and machine paths
        run: |
          set -euo pipefail
          if grep -rnE "sk-[A-Za-z0-9]{20,}|D:/Deeeeeepseeeeek|C:\\\\Users\\\\[A-Za-z]+" \
               --include="*.js" --include="*.mjs" --include="*.cjs" \
               --include="*.json" --include="*.md" --include="*.yml" \n               --exclude-dir=.git --exclude-dir=.github . ; then
            echo "::error::found secret or machine-specific path"
            exit 1
          fi
          echo "clean"
